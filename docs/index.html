<!doctype html>  
<html lang="zh-CN" data-theme="dark">  
<head>  
  <meta charset="utf-8" />  
  <meta name="viewport" content="width=device-width,initial-scale=1" />  
  <title>GNEWS - 全网热搜聚合</title>  
  <style>  
    :root{  
      --bg:#0b1020; --fg:#e6edf3; --muted:#9aa4b2; --border:#20304a;  
      --card:#0f172a; --shadow:0 10px 28px rgba(0,0,0,.35);  
      --link:#7aa7ff; --btn:#3b82f6; --btnfg:#fff;  
      --chip:#111827; --chipfg:#cbd5e1;  
    }  
    html[data-theme="light"]{  
      --bg:#f6f8fa; --fg:#0f172a; --muted:#667085; --border:#e5e7eb;  
      --card:#ffffff; --shadow:0 10px 28px rgba(15,23,42,.10);  
      --link:#2563eb; --btn:#2563eb; --btnfg:#fff;  
      --chip:#f3f4f6; --chipfg:#334155;  
    }  
    *{box-sizing:border-box}  
    body{  
      margin:0; background:var(--bg); color:var(--fg);  
      font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;  
    }  
    header{  
      position:sticky; top:0; z-index:50;  
      background: color-mix(in srgb, var(--bg) 86%, transparent);  
      backdrop-filter: blur(10px) saturate(160%);  
      border-bottom:1px solid var(--border);  
    }  
    .bar{  
      height:60px; padding:0 16px; max-width:1400px; margin:0 auto;  
      display:flex; align-items:center; justify-content:space-between; gap:12px;  
    }  
    .title{display:flex; flex-direction:column; gap:2px; min-width:0}  
    .title strong{font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}  
    .title span{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}  
    .right{display:flex; align-items:center; gap:10px}  
    .chip{  
      font-size:12px; color:var(--chipfg); background:var(--chip);  
      border:1px solid var(--border); padding:6px 10px; border-radius:999px;  
    }  
    .btn{  
      border:1px solid var(--border); background:transparent; color:var(--fg);  
      padding:8px 12px; border-radius:10px; cursor:pointer; font-size:13px;  
    }  
    .btn.primary{background:var(--btn); border-color:transparent; color:var(--btnfg)}  
    main{max-width:1400px; margin:0 auto; padding:16px 12px 40px}  
    .grid{  
      display:grid; gap:16px;  
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));  
    }  
    @media (max-width: 900px){ .grid{grid-template-columns: 1fr;} .chip{display:none} }  
    .panel{  
      border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow);  
      border-radius:14px; overflow:hidden; display: flex; flex-direction: column;  
    }  
    .panel-h{  
      padding:12px 16px; border-bottom:1px solid var(--border);  
      display:flex; align-items:center; justify-content:space-between; gap:10px;  
      background: rgba(255,255,255,0.02);  
    }  
    .panel-h .name{font-weight:700; color: var(--link); font-size: 15px}  
    .panel-h .count{color:var(--muted); font-size:12px}  
    .list{padding:8px}  
    .item{  
      display:flex; gap:12px; padding:10px 12px; border-radius:10px;  
      transition: background 0.2s;  
    }  
    .item:hover{background: color-mix(in srgb, var(--card) 60%, var(--fg) 5%);}  
    .rank{  
      flex:0 0 24px; height:24px; line-height:24px; text-align:center;  
      border-radius:6px; color:var(--muted);  
      font-size:12px; font-weight: bold; background: rgba(128,128,128,0.1);  
    }  
    .rank-1{color:#fff; background:#ff4d4f}  
    .rank-2{color:#fff; background:#ff7a45}  
    .rank-3{color:#fff; background:#ffa940}  
      
    a{color:var(--fg); text-decoration:none; font-size:14px; line-height:1.4; display:block}  
    a:hover{color:var(--link); text-decoration:none}  
    .meta{color:var(--muted); font-size:11px; margin-top:4px}  
    .empty{  
      padding:60px 20px; color:var(--muted); text-align:center; grid-column: 1 / -1;  
    }  
    .error{  
      padding:60px 20px; color:#ff4d4f; text-align:center; grid-column: 1 / -1;  
    }  
  </style>  
</head>  
<body>  
  <header>  
    <div class="bar">  
      <div class="title">  
        <strong>GNEWS 全网热搜</strong>  
        <span id="subtitle">正在获取最新热议话题…</span>  
      </div>  
      <div class="right">  
        <span class="chip" id="status">加载中…</span>  
        <button class="btn" id="toggle">浅色</button>  
        <button class="btn primary" id="refresh">刷新</button>  
      </div>  
    </div>  
  </header>  
  
  <main>  
    <div id="content" class="grid"></div>  
    <div id="empty" class="empty" style="display:none">  
      没有数据。请检查 <code>docs/data.json</code> 是否存在，或稍后刷新。  
    </div>  
    <div id="error" class="error" style="display:none">  
      <h2>加载错误</h2>  
      <p id="error-message">无法加载数据，请检查控制台获取详细信息。</p>  
      <button class="btn primary" onclick="location.reload()">重新加载</button>  
    </div>  
  </main>  
  
  <script>  
    const root = document.documentElement;  
    const toggleBtn = document.getElementById('toggle');  
    const refreshBtn = document.getElementById('refresh');  
    const statusEl = document.getElementById('status');  
    const subtitleEl = document.getElementById('subtitle');  
    const contentEl = document.getElementById('content');  
    const emptyEl = document.getElementById('empty');  
    const errorEl = document.getElementById('error');  
    const errorMessageEl = document.getElementById('error-message');  
  
    function applyTheme(theme){  
      root.dataset.theme = theme;  
      localStorage.setItem('theme', theme);  
      toggleBtn.textContent = theme === 'dark' ? '浅色' : '深色';  
    }  
    applyTheme(localStorage.getItem('theme') || 'dark');  
  
    toggleBtn.addEventListener('click', () => {  
      applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');  
    });  
  
    refreshBtn.addEventListener('click', () => load(true));  
  
    function esc(s){   
      if(!s) return '';  
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));   
    }  
  
    function render(data){  
      try {  
        // 显示错误信息（如果有）  
        if (data.error) {  
          console.error(data.error);  
          errorMessageEl.textContent = data.error;  
          errorEl.style.display = 'block';  
          return;  
        }  
  
        const items = data.items || [];  
        const updated = data.updated_at || '刚刚';  
        subtitleEl.textContent = `最后更新 (北京时间)：${updated}`;  
          
        const byPlatform = new Map();  
        items.forEach(it => {  
          const key = it.source;  
          if(!byPlatform.has(key)) byPlatform.set(key, []);  
          byPlatform.get(key).push(it);  
        });  
  
        statusEl.textContent = `来源：${byPlatform.size} · 总计：${items.length}`;  
        contentEl.innerHTML = '';  
          
        if(byPlatform.size === 0){  
          emptyEl.style.display = 'block';  
          return;  
        }  
        emptyEl.style.display = 'none';  
        errorEl.style.display = 'none';  
  
        // 按照我们定义的顺序显示  
        const order = ["知乎", "微博", "百度热搜", "今日头条", "抖音热搜", "B站热搜", "贴吧", "财联社", "华尔街见闻", "澎湃新闻", "凤凰网"];  
        const sortedKeys = Array.from(byPlatform.keys()).sort((a,b) => {  
          let ia = order.indexOf(a), ib = order.indexOf(b);  
          return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);  
        });  
  
        for(const platform of sortedKeys){  
          const list = byPlatform.get(platform);  
          const card = document.createElement('section');  
          card.className = 'panel';  
          card.innerHTML = `  
            <div class="panel-h">  
              <div class="name">${esc(platform)}</div>  
              <div class="count">${list.length} 条</div>  
            </div>  
            <div class="list">  
              ${list.slice(0, 20).map(it => {  
                const r = it.rank || '-';  
                const rankClass = r <= 3 ? `rank-${r}` : '';  
                return `  
                <div class="item">  
                  <div class="rank ${rankClass}">${esc(r)}</div>  
                  <div style="min-width:0">  
                    <a href="${esc(it.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>  
                  </div>  
                </div>  
                `;  
              }).join('')}  
            </div>  
          `;  
          contentEl.appendChild(card);  
        }  
      } catch (e) {  
        console.error('渲染错误:', e);  
        errorMessageEl.textContent = `渲染错误: ${e.message}`;  
        errorEl.style.display = 'block';  
      }  
    }  
  
    async function load(bustCache=false){  
      try{  
        statusEl.textContent = '刷新中...';  
        const url = './data.json' + (bustCache ? `?ts=${Date.now()}` : '');  
        const res = await fetch(url, { cache: 'no-store' });  
          
        if (!res.ok) {  
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);  
        }  
          
        const data = await res.json();  
        render(data);  
      }catch(e){  
        console.error('加载错误:', e);  
        statusEl.textContent = '加载失败';  
        errorMessageEl.textContent = `加载失败: ${e.message}`;  
        errorEl.style.display = 'block';  
        emptyEl.style.display = 'none';  
        contentEl.innerHTML = '';  
      }  
    }  
    load(false);  
  </script>  
</body>  
</html>
